# Render Blueprint — New → Blueprint → pick this repo.
services:
  - type: web
    name: breadcrumb-taxonomy-optimizer
    runtime: docker
    plan: free               # sleeps after 15 min idle, 512 MB RAM. Upgrade to "starter" for always-on + JS-rendered crawls
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL     # Supabase → Connect → Session pooler URI, with postgresql+psycopg:// prefix
        sync: false
      - key: API_TOKEN        # the team password people type on the login screen
        sync: false
      - key: OPENAI_API_KEY   # optional — enables the AI fallback (or set ANTHROPIC_API_KEY instead)
        sync: false
      - key: EMBEDDED_WORKER
        value: "true"
      - key: WORKER_THREADS
        value: "2"
      - key: LLM_MODEL
        value: claude-opus-5-5
      - key: CORS_ORIGINS
        value: "*"
